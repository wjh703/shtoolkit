[build-system]
requires = ["setuptools", "Cython", "numpy"]
build-backend = "setuptools.build_meta"

[project]
name = "shtoolkit"
authors = [{name = "wjh", email = "joycug@163.com"}]
version = "1.0"
description = "A Python/Cython package for excuting spherical harmonic analysis/synthesis and processing GRACE/SLR gravatitional spherical harmonic coefficients."
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "numba",
    "tqdm",
    "pyfftw",
    "PyWavelets",
    "pyshtools>=4.13.1",
]
requires-python = ">=3.12"

[project.optional-dependencies]
cartopy = ["cartopy"]
pyshtools = ["pyshtools"]

[tool.mypy]
ignore_missing_imports = true

[tool.black]
line-length = 120

[tool.ruff]
line-length = 120
lint = {select = ["E", "F", "B", "I"], ignore = ["E741", "B006"]}
format = {quote-style = "double"}

[dependency-groups]
dev = [
    "cartopy>=0.23.0",
    "eofs>=2.0.0",
    "matplotlib>=3.10.7",
    "netcdf4>=1.7.3",
    "regionmask>=0.13.0",
    "xarray>=2025.10.1",
]
